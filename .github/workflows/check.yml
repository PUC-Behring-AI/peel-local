# Runs the local gate (`make check`) on every push and pull request.
#
# The GPU/model stack (torch, transformers, sentence-transformers, hdbscan)
# is left out on purpose: Phase 1-3 import it lazily, inside the functions
# that need it, and the tiers `make check` runs never call those. That keeps
# this job CPU-only and free of the one dependency (hdbscan) most likely to
# fail to build.
#
# Tier 1 and Tier 2 tests skip themselves when nltk or the spaCy model is
# missing. A skip here would mean the environment below is incomplete, and a
# green run that tested nothing is worse than a red one -- so any skip fails
# the job.

name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the documented minimum (CONTRIBUTING.md); 3.13 is what the
        # authors run locally.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (without the GPU/model stack)
        run: |
          grep -vE '^(--extra-index-url|torch|transformers|sentence-transformers|hdbscan)\b' \
            requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          python -m pip install --upgrade pip
          python -m pip install -r "$RUNNER_TEMP/requirements-ci.txt" pytest ruff
          python -m spacy download en_core_web_sm
          python -c "import nltk; nltk.download('wordnet', quiet=True); nltk.download('omw-1.4', quiet=True)"

      - name: make check
        run: make check PYTHON=python 2>&1 | tee "$RUNNER_TEMP/check.log"
        shell: bash -o pipefail {0}

      - name: Refuse a run that skipped tests
        run: |
          if grep -E '^SKIPPED' "$RUNNER_TEMP/check.log"; then
            echo "::error::Tests were skipped: the CI environment is missing a dependency the gate expects."
            exit 1
          fi
