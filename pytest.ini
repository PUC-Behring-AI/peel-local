[pytest]
testpaths = tests
# Tier 3 tests need a GPU, a ~420MB model download, or a running Ollama, so
# they are deselected by default. Run them with `pytest -m slow` (or
# `pytest -m ""` for everything) once that infrastructure is in place.
addopts = -m "not slow" --strict-markers -ra
markers =
    slow: needs a GPU, a downloaded model, or a running Ollama
